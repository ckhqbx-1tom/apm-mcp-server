[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apm-mcp-server"
version = "0.1.0"
description = "Read-only MCP server for ManageEngine Applications Manager"
requires-python = ">=3.11"
dependencies = [
  "defusedxml>=0.7.1,<1",
  "httpx>=0.27,<1",
  "mcp>=1.2,<2",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
apm-mcp-server = "apm_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/apm_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

